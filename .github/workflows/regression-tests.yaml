name: Regression tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  # Restrict permissions to read-only for security
  contents: read

concurrency:
  # Specific group name to cancel in-progress builds for the same PR/ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: ${{ matrix.shortosname }} | ${{ matrix.compiler }} | ${{ matrix.cxx_std }} | ${{ matrix.stdlib }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        shortosname: [ubu-24]
        compiler: [g++-14, g++-13]
        cxx_std: [c++2b]
        stdlib: [libstdc++]
        include:
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-19
            cxx_std: c++20
            stdlib: libstdc++
          - os: ubuntu-24.04
            shortosname: ubu-24
            compiler: clang++-19
            cxx_std: c++23
            stdlib: libc++-18-dev
          - os: ubuntu-22.04
            shortosname: ubu-22
            compiler: clang++-15
            cxx_std: c++20
            stdlib: libstdc++
          - os: ubuntu-22.04
            shortosname: ubu-22
            compiler: clang++-15
            cxx_std: c++20
            stdlib: libc++-15-dev
          - os: macos-14
            shortosname: mac-14
            compiler: clang++
            cxx_std: c++2b
            stdlib: default
          - os: windows-2025
            shortosname: win-25
            compiler: cl.exe
            cxx_std: c++latest
            stdlib: default
            vs_version: '[17.0,18.0)'   # VS 2022
          - os: windows-2022
            shortosname: win-22
            compiler: cl.exe
            cxx_std: c++20
            stdlib: default
            vs_version: '[17.0,18.0)'   # VS 2022
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare compilers - macOS
      if: matrix.os == 'macos-13'
      run: |
        sudo xcode-select --switch /Applications/Xcode_14.3.1.app
        sudo ln -s "$(brew --prefix llvm@15)/bin/clang" /usr/local/bin/clang++-15

    - name: Prepare compilers - Ubuntu 24.04
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo sudo apt-get install clang-19

    - name: Run regression tests - Linux and macOS version
      if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
      run: |
        cd regression-tests
        bash run-tests.sh -c ${{ matrix.compiler }} -s ${{ matrix.cxx_std }} -d ${{ matrix.stdlib }} -l ${{ matrix.os }}

    - name: Set up MSVC environment - Windows
      if: startsWith(matrix.os, 'windows')
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

        $vsPath = & $vswhere -products * -version '${{ matrix.vs_version }}' -latest `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
        if (-not $vsPath) {
          # List what *is* installed, for diagnosis
          & $vswhere -all -products * -format text
          throw "No Visual Studio in range ${{ matrix.vs_version }} with x64 C++ tools found"
        }
        $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
        if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
        Write-Host "Using VS at: $vsPath"

        # Capture the environment before and after running vcvars
        function Get-Env([string]$cmd) {
          $h = @{}
          cmd /c "$cmd set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $h[$matches[1]] = $matches[2] }
          }
          $h
        }
        $before = Get-Env ''
        $after  = Get-Env "`"$vcvars`" >nul && "
        if (-not $after['VCToolsInstallDir']) { throw "vcvars64.bat did not set up the environment" }

        # Export only what vcvars changed - never overwrite the whole PATH
        # New PATH entries -> GITHUB_PATH (each line is prepended, so add them in reverse order)
        $oldPath = $before['Path'] -split ';'
        $newEntries = @(($after['Path'] -split ';') | Where-Object { $_ -and ($oldPath -notcontains $_) })
        [array]::Reverse($newEntries)
        $newEntries | ForEach-Object { $_ >> $env:GITHUB_PATH }

        # Other new/changed variables -> GITHUB_ENV
        foreach ($k in $after.Keys) {
          if ($k -ieq 'Path') { continue }
          if ($before[$k] -ne $after[$k]) { "$k=$($after[$k])" >> $env:GITHUB_ENV }
        }

    - name: Run regression tests - Windows version
      if: startsWith(matrix.os, 'windows')
      shell: bash
      run: |
        echo "--- Tool resolution ---"
        for t in cl.exe link.exe git diff bash; do echo "$t -> $(command -v $t)"; done
        echo "VCToolsInstallDir=$VCToolsInstallDir"
        # MSVC version banner (cl prints it to stderr). `|| true` because GitHub runs bash
        # with `-e -o pipefail`, and cl.exe without inputs / SIGPIPE from head must not fail the step
        cl.exe 2>&1 >/dev/null | head -n 1 || true
        echo "-----------------------"
        git config --local core.autocrlf false
        cd regression-tests
        bash run-tests.sh -c ${{ matrix.compiler }} -s ${{ matrix.cxx_std }} -d ${{ matrix.stdlib }} -l ${{ matrix.os }}

    - name: Upload patch
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cxx_std }}-${{ matrix.stdlib }}.patch
        path: regression-tests/${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cxx_std }}-${{ matrix.stdlib }}.patch
        if-no-files-found: ignore

  aggregate-results:
    needs: regression-tests
    if:  success() || failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download all patches
        uses: actions/download-artifact@v4
        with:
          path: downloaded-results

      - name: Prepare result files
        id: prepare_files
        run: |
          mkdir aggregated-results
          echo "Flattening file hierarchy"
          find . -type f -wholename "./downloaded-results*" -exec mv {} aggregated-results \;
          patch_count=$(ls aggregated-results 2>/dev/null | wc -l)
          echo "patch_count=${patch_count}" >> $GITHUB_OUTPUT

      - name: Upload aggregated results
        if: steps.prepare_files.outputs.patch_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-results
          path: aggregated-results
          if-no-files-found: ignore
