name: Regression tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  # Restrict permissions to read-only for security
  contents: read

concurrency:
  # Specific group name to cancel in-progress builds for the same PR/ref
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    name: ${{ matrix.shortosname }} | ${{ matrix.compiler }} | ${{ matrix.cxx_std }} | ${{ matrix.stdlib }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - { os: macos-14,     shortosname: mac-14, compiler: clang++,    cxx_std: c++2b,     stdlib: default }

          # Ubuntu Clang
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: clang++-15, cxx_std: c++20,     stdlib: libstdc++ }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: clang++-15, cxx_std: c++20,     stdlib: libc++-15-dev }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-19, cxx_std: c++20,     stdlib: libstdc++ }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-19, cxx_std: c++23,     stdlib: libc++-18-dev }

          # Ubuntu G++
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: g++-13,     cxx_std: c++2b,     stdlib: libstdc++ }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: g++-14,     cxx_std: c++2b,     stdlib: libstdc++ }

          # Windows
          - { os: windows-2025, shortosname: win-25, compiler: cl.exe,     cxx_std: c++20,     stdlib: default, vs_version: '18' }
          - { os: windows-2025, shortosname: win-25, compiler: cl.exe,     cxx_std: c++latest, stdlib: default, vs_version: '18' }

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Prepare compiler - Clang 19
      if: matrix.os == 'ubuntu-24.04' && startsWith(matrix.compiler, 'clang')
      run: |
        sudo apt-get install -y clang-19

    - name: Set up MSVC - Windows
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        vsversion: ${{ matrix.vs_version }}

    - name: Run regression tests
      shell: bash
      run: |
        git config --local core.autocrlf false
        cd regression-tests
        bash run-tests.sh -c ${{ matrix.compiler }} -s ${{ matrix.cxx_std }} -d ${{ matrix.stdlib }} -l ${{ matrix.os }}

    - name: Upload patch
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cxx_std }}-${{ matrix.stdlib }}.patch
        path: regression-tests/${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cxx_std }}-${{ matrix.stdlib }}.patch
        if-no-files-found: ignore

  aggregate-results:
    needs: regression-tests
    if:  success() || failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download all patches
        uses: actions/download-artifact@v8
        with:
          path: downloaded-results

      - name: Prepare result files
        id: prepare_files
        run: |
          mkdir aggregated-results
          echo "Flattening file hierarchy"
          find . -type f -wholename "./downloaded-results*" -exec mv {} aggregated-results \;
          patch_count=$(ls aggregated-results 2>/dev/null | wc -l)
          echo "patch_count=${patch_count}" >> $GITHUB_OUTPUT

      - name: Upload aggregated results
        if: steps.prepare_files.outputs.patch_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-results
          path: aggregated-results
          if-no-files-found: ignore
