name: Multi-platform Build of cppfront

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  # Restrict permissions to read-only for security
  contents: read

concurrency:
  # Specific group name to cancel in-progress builds for the same PR/ref
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.shortosname }} | ${{ matrix.compiler }} | ${{ matrix.cxx_std }} | ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: -std=${{ matrix.cxx_std }} -Wall -Wextra -Wold-style-cast -Wunused-parameter -Wpedantic -Werror -pthread -Wno-unknown-warning -Wno-unknown-warning-option

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - { os: macos-14,     shortosname: mac-14, compiler: clang++,    cxx_std: 'c++20' }
          - { os: macos-15,     shortosname: mac-15, compiler: clang++,    cxx_std: 'c++20' }

          # Ubuntu Clang
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: clang++-12, cxx_std: 'c++20' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: clang++-14, cxx_std: 'c++20' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: clang++-15, cxx_std: 'c++20' }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-16, cxx_std: 'c++20' }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-17, cxx_std: 'c++20' }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-18, cxx_std: 'c++20' }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: clang++-18, cxx_std: 'c++23' }

          # Ubuntu G++
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: g++-10,     cxx_std: 'c++20' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: g++-11,     cxx_std: 'c++20' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: g++-11,     cxx_std: 'c++2b' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: g++-12,     cxx_std: 'c++20' }
          - { os: ubuntu-22.04, shortosname: ubu-22, compiler: g++-12,     cxx_std: 'c++2b' }
          - { os: ubuntu-24.04, shortosname: ubu-24, compiler: g++-14,     cxx_std: 'c++2b' }

          # Windows
          - { os: windows-2025, shortosname: win-25, compiler: cl.exe,     cxx_std: c++latest, vs_version: '18' }

    steps:
      - uses: actions/checkout@v7

      - name: Install compiler
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y "${CXX/clang++-/clang-}"

      - name: Set up MSVC - Windows
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: ${{ matrix.vs_version }}

      - name: Compiler name & version
        shell: bash
        run: |
          if [[ "$CXX" == *"cl.exe"* ]]; then
            cl.exe 2>&1 >/dev/null | head -n 1 || true
          else
            $CXX --version
          fi

      - name: Build
        shell: bash
        run: |
          if [[ "$CXX" == *"cl.exe"* ]]; then
            cl.exe source/cppfront.cpp -std:${{ matrix.cxx_std }} -MD -EHsc -W4 -WX
          else
            $CXX source/cppfront.cpp $CXXFLAGS -o cppfront
          fi
